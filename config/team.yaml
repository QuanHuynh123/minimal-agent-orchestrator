team:
  name: "hybrid-agent-squad"
  version: "2.0"
  single_writer_lock: true

# Định nghĩa các cổng kết nối (Providers)
providers:
  local_9router:
    base_url: "http://127.0.0.1:20128/v1"
    api_key_env: "NINE_ROUTER_API_KEY"
    default_key: "sk-default"
  ide_bridge:
    type: "mcp_loopback"
    timeout_sec: 120

# Cấu hình chi tiết từng Role và Model phụ trách
roles:
  coordinator:
    enabled: true
    provider: "ide_bridge"
    display_name: "Antigravity (IDE Coordinator)"
    model: "Google Antigravity (Gemini)"
    allowed_actions: ["pair_programming", "ui_coordination", "task_dispatch", "architecture"]

  designer:
    enabled: true
    provider: "local_9router"
    display_name: "Claude Sonnet 4.5"
    model: "kr/claude-sonnet-4.5-thinking"
    allowed_actions: ["ui_ux_design", "bento_styling", "dom_contract"]
    forbidden_actions: ["backend_write"]

  router:
    enabled: true
    provider: "local_9router"
    display_name: "Claude Sonnet 4.5 Thinking"
    model: "kr/claude-sonnet-4.5-thinking"
    fallback_model: null
    temperature: 0.2
    max_thinking_tokens: 200
    allowed_actions: ["analyze", "plan", "triage"]
    forbidden_actions: ["direct_write", "modify_config"]

  writer:
    enabled: true
    provider: "local_9router"
    display_name: "DeepSeek V4.1 Flash"
    model: "Deepseek V4.1 Flash/deepseek-ai/deepseek-v4.1-flash-1017"
    fallback_model: null
    temperature: 0.1
    max_thinking_tokens: 200
    output_format: "search_replace_blocks"
    allowed_actions: ["read_scoped_files", "propose_patch"]
    forbidden_actions: ["out_of_scope_edit", "unapproved_dependency"]

  reviewer:
    enabled: true
    provider: "local_9router"
    display_name: "Claude Opus 5.5 High"
    model: "ag/claude-opus-5-5-high"
    fallback_model: null
    temperature: 0.1
    allowed_actions: ["review_diff", "approve", "reject"]
    forbidden_actions: ["direct_write"]

  validator:
    enabled: true
    type: "deterministic_script" # Chạy bằng code thuần, tốn 0 token
    script: "scripts/validator.mjs"
