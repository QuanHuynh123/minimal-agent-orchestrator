team:
  name: hybrid-agent-squad
  version: "3.1"
  single_writer_lock: true
providers:
  local_9router:
    type: openai_compatible
    base_url: http://127.0.0.1:20128/v1
    api_key_env: NINE_ROUTER_API_KEY
    default_key: sk-default
roles:
  router:
    enabled: true
    provider: local_9router
    display_name: Claude Sonnet 4.5 Thinking
    model: kr/claude-sonnet-4.5-thinking
    default_model: kr/claude-sonnet-4.5-thinking
    models:
      - kr/claude-sonnet-4.5-thinking
    fallback_model: null
    temperature: 0.2
    max_thinking_tokens: 200
    spec_file: roles/router.md
    allowed_actions:
      - ui_ux_design
      - scope_routing
      - task_planning
    forbidden_actions:
      - direct_write
  writer:
    enabled: true
    provider: local_9router
    display_name: deepseek-v4.1-flash-1017
    model: Deepseek V4.1 Flash/deepseek-ai/deepseek-v4.1-flash-1017
    default_model: Deepseek V4.1 Flash/deepseek-ai/deepseek-v4.1-flash-1017
    models:
      - Deepseek V4.1 Flash/deepseek-ai/deepseek-v4.1-flash-1017
      - ag/gemini-3.8-flash-high
    fallback_model: ag/gemini-3.8-flash-high
    temperature: 0.1
  designer:
    enabled: true
    provider: local_9router
    display_name: claude-sonnet-5-5-medium
    model: ag/claude-sonnet-5-5-medium
    default_model: ag/claude-sonnet-5-5-medium
    models:
      - ag/claude-sonnet-5-5-medium
    fallback_model: null
    temperature: 0.1
  reviewer:
    enabled: true
    provider: local_9router
    display_name: claude-opus-5-5-medium
    model: ag/claude-opus-5-5-medium
    default_model: ag/claude-opus-5-5-medium
    models:
      - ag/claude-opus-5-5-medium
    fallback_model: null
    temperature: 0.1
