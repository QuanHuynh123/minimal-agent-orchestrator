# ==============================================================================
# AGENT TEAM OPERATIONAL POLICY & PROJECT GUARDRAILS (policy.yaml)
# ==============================================================================
# PURPOSE:
# - Defines operational policies and safety guardrails for the AI Agent Squad.
# - Keep your project-specific overrides in `config/policy.local.yaml` (gitignored)
#   or customize this template for your repository.
# ==============================================================================

policy:
  version: "3.1.0"

  # Project identifier & primary language (customize for your repo)
  project_id: "my-project"
  language: "javascript"

  # ----------------------------------------------------------------------------
  # 1. SCOPE CONTROL & PROJECT BOUNDARIES
  # ----------------------------------------------------------------------------
  scope_control:
    max_files_per_task: 5
    max_scope_increase: 1
    allow_new_files: true
    new_files_only_in_scope: true
    strict_scope_enforcement: true

    # Directories the AI squad is allowed to read/modify (customize for your repo)
    allowed_dirs:
      - "src/"
      - "app/"
      - "web/"
      - "tests/"
      - "docs/"

    # Protected files that require explicit human approval
    protected_files:
      - "package.json"
      - "requirements.txt"

    # Exclude heavy vendor/build/dataset directories from Router context scans
    context_exclude:
      - "vendor/"
      - "dist/"
      - "build/"

    # Maximum file size (bytes) included in Router context (default 512 KB)
    context_max_file_bytes: 524288

  # Domain partition patterns (frontend vs backend routing & manual review gate)
  domain_patterns:
    frontend:
      - "**/*.html"
      - "**/*.htm"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.sass"
      - "**/*.less"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.svelte"
      - "**/web/**"
      - "**/frontend/**"
      - "**/client/**"
      - "**/components/**"
      - "**/views/**"
      - "**/pages/**"

  # ----------------------------------------------------------------------------
  # 2. TASK MODES (Quick, Standard, Consult)
  # ----------------------------------------------------------------------------
  task_modes:
    quick:
      max_files: 3
      max_runtime_sec: 900
      skip_router_and_reviewer: true

    standard:
      max_runtime_sec: 1800
      skip_router_and_reviewer: false

    consult:
      max_runtime_sec: 180
      skip_router_and_reviewer: true
      mutation_enabled: false

  # ----------------------------------------------------------------------------
  # 3. APPROVAL GATES
  # ----------------------------------------------------------------------------
  approval_gates:
    plan_approval_mode: "auto_if_small"
    small_task_threshold_files: 3
    require_code_review: true
    review_min_risk_level: "high"
    require_human_approval_for_cross_role_edit: true

  # ----------------------------------------------------------------------------
  # 4. RETRY & TOKEN BUDGETS
  # ----------------------------------------------------------------------------
  retry_and_escalation:
    max_retries_per_task: 3
    abort_on_identical_error_count: 2
    on_exhausted: "mark_blocked_and_continue"
    base_token_budget_per_agent: 150000
    token_budget_per_task: 300000
    night_token_budget_total: 5000000

  # ----------------------------------------------------------------------------
  # 5. EXECUTION GUARDRAILS (HR-1 & HR-2)
  # ----------------------------------------------------------------------------
  execution_guardrails:
    enforce_command_timeouts: true
    kill_process_tree_on_timeout: true
    default_cli_timeout_sec: 180
    healthcheck_timeout_sec: 15
    network_connect_timeout_sec: 5
    network_max_time_sec: 180
    max_silence_duration_sec: 60
    prefer_mcp_tools: true
    ban_unbounded_commands: true
    block_powershell_curl_alias: true
    strict_model_match: true
    model_aliases:
      "ag/gemini-3.8-flash-medium": "gemini-3.8-flash-n"
    circuit_breaker_ttl_ms: 600000

  # ----------------------------------------------------------------------------
  # 6. GIT HYGIENE
  # ----------------------------------------------------------------------------
  git_hygiene:
    require_clean_worktree_before_start: true
    rollback_on_validation_fail: true
    auto_commit_on_done: true
    confirm_frontend_branch_before_merge: true
    commit_message_prefix: "[AI-Task]"

  # ----------------------------------------------------------------------------
  # 7. PROJECT VALIDATION GATES (0-token checks)
  # Configure your project's lint/test commands here or in policy.local.yaml.
  # ----------------------------------------------------------------------------
  validation:
    max_baseline_failures: 3
    max_baseline_runtime_sec: 300
    enobufs_external_socket_threshold: 50
    flaky_baseline_failures:
      - id: "win32_enobufs_socket_exhaustion"
        check_name: "*"
        error_pattern: "\\bENOBUFS\\b"
        owner: "Alex Rivera"
        due_at: "2026-12-15"
        note: "Flaky only when isolated retry passes AND non-test process sockets exceed threshold; 3 consecutive hits block task"
    fast_checks: []
    suite_checks: []

  # ----------------------------------------------------------------------------
  # 8. COCKPIT WEB DASHBOARD
  # ----------------------------------------------------------------------------
  cockpit:
    host: "127.0.0.1"
    port: 4310
