project:
  id: "my-workspace"
  language: "polyglot"
  repo_root: "../"
  
  # Chỉ cho phép Applier ghi vào các thư mục nguồn của dự án
  allowed_dirs:
    - "src/"
    - "lib/"
    - "app/"
    - "core/"
    - "ui/"
    - "tests/"
    - "scripts/"
    - "agent-team/"
  
  # Các file nhạy cảm tuyệt đối cấm AI tự sửa
  protected_files:
    - "**/.env*"
    - "package.json"
    - "package-lock.json"
    - "requirements.txt"
    - "agent-team/scripts/**"
    - "agent-team/runtime/**"
    - "agent-team/config/**"
    - ".github/workflows/**"

  # Chuỗi lệnh kiểm tra bắt buộc (Chạy tuần tự, 0 Token)
  validation:
    fast_checks:
      - name: "agent_team_self_test"
        run: "node agent-team/scripts/test-applier-v2.1.mjs"
        timeout_sec: 10
      - name: "agent_runtime_self_test"
        run: "node agent-team/scripts/test-runtime-v3.mjs"
        timeout_sec: 10
      - name: "agent_cockpit_self_test"
        run: "node agent-team/scripts/test-cockpit.mjs"
        timeout_sec: 10
    suite_checks:
      - name: "full_self_test_suite"
        run: "node agent-team/scripts/test-applier-v2.1.mjs && node agent-team/scripts/test-runtime-v3.mjs && node agent-team/scripts/test-cockpit.mjs"
        timeout_sec: 30
