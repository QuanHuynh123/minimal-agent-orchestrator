project:
  id: "tool-download-stable"
  language: "python"
  repo_root: "../"
  
  # Chỉ cho phép Applier ghi vào các thư mục này
  allowed_dirs:
    - "core/"
    - "ui/"
    - "ui_bridge/"
    - "ui_web/"
    - "tests/"
    - "scripts/"
    - "agent-team/"
  
  # Các file nhạy cảm tuyệt đối cấm AI tự sửa
  protected_files:
    - ".env"
    - "requirements.txt"

  # Chuỗi lệnh kiểm tra bắt buộc (Chạy tuần tự, 0 Token)
  validation:
    fast_checks:
      - name: "tab_indentation_check"
        run: ".\\.venv\\Scripts\\python.exe -m unittest tests/test_indentation.py"
        timeout_sec: 15
    suite_checks:
      - name: "unit_test_suite"
        run: ".\\.venv\\Scripts\\python.exe -m unittest discover -s tests -v"
        timeout_sec: 60
