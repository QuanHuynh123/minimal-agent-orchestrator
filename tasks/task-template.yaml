# ============================================================================
# 1. CÁC TRƯỜNG BẮT BUỘC DO IDE PLANNER / HUMAN ĐIỀN (REQUIRED FIELDS)
# ============================================================================
task_id: "T-2026-11-02-001"
title: "Mô tả ngắn gọn tiêu đề task (< 80 ký tự)"
status: "ready" # "ready" để chạy ngay; "draft_review" nếu muốn chờ con người duyệt trên Web Cockpit
goal: "Mô tả cụ thể hàm/lớp cần thêm hoặc sửa (< 150 dòng code thay đổi mỗi task; nếu lớn hơn phải tách thành 001A, 001B)"
scope:
  - "src/example.py"
  - "tests/test_example.py"
acceptance_criteria:
  - "Hàm X xử lý đúng trường hợp Y"
  - "Toàn bộ unit tests trong scope và validator fast PASS 100%"

# ============================================================================
# 2. CÁC TRƯỜNG TÙY CHỌN (OPTIONAL — CÓ GIÁ TRỊ MẶC ĐỊNH AN TOÀN)
# ============================================================================
mode: "quick" # "quick" (<=3 files, low/medium risk) | "standard" (đầy đủ quy trình có Reviewer) | "consult" (tư vấn/khảo sát kiến trúc, chỉ đọc không sửa code)
risk_level: "low" # "low" | "medium" | "high" | "critical"
force_ai_review: false # Đặt true nếu muốn ép chạy AI Reviewer ngay cả khi risk_level là low/medium
constraints:
  - "Giữ nguyên chuẩn thụt lề (indentation) của file gốc trong dự án"
  - "Không đổi tên hàm/biến dùng chung xuyên nhiều file nếu không thực sự cần thiết"
forbidden_files:
  - ".env*"
  - "package.json"
  - "package-lock.json"
  - "requirements.txt"
allow_scope_expansion: false
justification: ""
approval: null # Khi risk_level >= high: { by: "human", scope_hash: "<sha1>" }

# ============================================================================
# 3. CÁC TRƯỜNG NỘI BỘ DO ORCHESTRATOR TỰ GHI (KHÔNG CẦN ĐIỀN KHI TẠO TASK)
# ============================================================================
# project_id, owner, retries, error_history, scope_expansions,
# validation_result, review_result, last_report, created_at, updated_at

